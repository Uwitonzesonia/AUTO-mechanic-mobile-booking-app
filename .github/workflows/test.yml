name: Test and Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npx jest --watchAll=false --coverage

      - name: Generate Coverage Badge
        run: |
          mkdir -p badges
          npx --yes make-coverage-badge --output-path ./badges/coverage.svg

      - name: Commit Coverage Badge
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f badges/coverage.svg
          git diff --staged --quiet || (git commit -m "chore: update coverage badge [skip ci]" && git push)